<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Nunito",system-ui,sans-serif;color:#fff;}
.c{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
 background:linear-gradient(135deg,#6a5cff 0%,#b05cff 45%,#ff5d8f 80%,#ffb84d 120%);}
.c:before{content:"";position:absolute;width:760px;height:760px;border-radius:50%;background:rgba(255,255,255,.10);right:-200px;top:-260px}
.c:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,.08);left:-160px;bottom:-220px}
.in{position:relative;z-index:1;padding:0 70px}
.globe{font-size:150px;line-height:1;margin-bottom:14px}
h1{font-weight:900;font-size:128px;line-height:1.02;letter-spacing:-1px;text-shadow:0 6px 24px rgba(0,0,0,.18)}
p{font-weight:900;font-size:50px;margin-top:18px;opacity:.97}
.chips{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.chips span{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:8px 24px;font-weight:900;font-size:34px}
.land{width:1200px;height:628px}.land .globe{font-size:96px}.land h1{font-size:100px}.land p{font-size:42px;margin-top:10px}.land .chips{margin-top:24px}.land .chips span{font-size:28px;padding:6px 20px}
.sq{width:1200px;height:1200px}
</style></head><body>
<div class="c land" id="sq"><div class="in"><div class="globe">🌍</div><h1>Atlas de Poche</h1><p>Quiz de géographie gratuit</p>
<div class="chips"><span>Capitales</span><span>Drapeaux</span><span>Départements</span><span>Mers</span><span>Monuments</span><span>Globe</span></div></div></div>
</body></html>
