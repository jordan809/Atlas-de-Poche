<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Globe interactif — Atlas de poche</title>
<meta name="description" content="Globe terrestre 3D interactif : clique sur un pays pour voir son nom, son drapeau et sa capitale.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  :root{ --eu:#5b8def; --as:#ff8f3f; --af:#2fc4a8; --na:#e8554e; --sa:#9b5de5; --oc:#00b8d4; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{ font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#fff; background:#0d0a1f; overflow:hidden; }
  #globeViz{ position:fixed; inset:0; }

  .topbar{ position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; gap:12px; padding:14px 16px; pointer-events:none; }
  .back{ pointer-events:auto; text-decoration:none; color:#fff; font-weight:800;
    background:rgba(255,255,255,0.14); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.2);
    padding:9px 16px; border-radius:30px; font-size:0.95rem; display:flex; align-items:center; gap:7px; }
  .back:hover{ background:rgba(255,255,255,0.24); }
  .title{ font-weight:800; font-size:1rem; text-shadow:0 2px 10px rgba(0,0,0,.6); }

  #loading{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:20; background:#0d0a1f; text-align:center; padding:20px; }
  .spinner{ width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.2); border-top-color:#9d7bff; animation:spin 1s linear infinite; }
  @keyframes spin{to{transform:rotate(360deg)}}

  .hint{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:5;
    color:#fff; font-weight:700; font-size:.9rem; text-shadow:0 2px 8px rgba(0,0,0,.6);
    background:rgba(0,0,0,.28); padding:9px 18px; border-radius:30px; backdrop-filter:blur(4px); }
  .hint.hide{ display:none; }

  #info{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(150%);
    z-index:10; width:min(92vw,420px);
    background:rgba(255,255,255,0.97); color:#2b2350; border-radius:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.55); padding:16px 18px;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    display:flex; align-items:center; gap:15px; }
  #info.show{ transform:translateX(-50%) translateY(0); }
  #info .flag{ font-size:2.8rem; line-height:1; flex:none; }
  #info .flag img{ width:56px; height:auto; border-radius:5px; box-shadow:0 2px 7px rgba(0,0,0,.3); display:block; }
  #info .txt{ flex:1; min-width:0; }
  #info .country{ font-weight:800; font-size:1.3rem; line-height:1.1; }
  #info .cap{ color:#6b6396; font-weight:700; margin-top:3px; font-size:.98rem; }
  #info .cap b{ color:#6a5cff; }
  #info .cont{ display:inline-block; margin-top:7px; font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#fff; background:#9d7bff; padding:3px 11px; border-radius:20px; }
  #info .close{ background:none;border:none;font-size:1.3rem;cursor:pointer;color:#b0a8c8; align-self:flex-start; line-height:1; }
</style>
</head>
<body>
  <div id="globeViz"></div>

  <div class="topbar">
    <a class="back" href="/index.html">← Retour</a>
    <span class="title">🌍 Globe interactif</span>
  </div>

  <div class="hint" id="hint">Fais tourner le globe 🌍 et clique sur un pays</div>

  <div id="info">
    <span class="flag" id="iFlag"></span>
    <div class="txt">
      <div class="country" id="iCountry"></div>
      <div class="cap" id="iCap"></div>
      <span class="cont" id="iCont"></span>
    </div>
    <button class="close" id="iClose" aria-label="Fermer">✕</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div>Chargement du globe…</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<script>
(async function(){
  const COLORS = { "Europe":"#5b8def","Asie":"#ff8f3f","Afrique":"#2fc4a8","Amérique du Nord":"#e8554e","Amérique du Sud":"#9b5de5","Océanie":"#00b8d4" };

  // Code ISO2 depuis l'emoji drapeau : 🇫🇷 -> "FR"
  function flagToISO(flag){
    const cp = Array.from(flag).map(c=>c.codePointAt(0));
    if(cp.length<2 || cp[0]<0x1F1E6) return "";
    return String.fromCharCode(cp[0]-0x1F1E6+65, cp[1]-0x1F1E6+65);
  }
  // Vraie image de drapeau (s'affiche partout, même sur Windows)
  function flagImg(flag, h){
    const iso = flagToISO(flag).toLowerCase();
    return iso ? '<img alt="" src="https://flagcdn.com/h'+(h||40)+'/'+iso+'.png">' : flag;
  }

  // On réutilise la base DATA d'index.html (une seule source de vérité)
  let DATA = [];
  try{
    const html = await (await fetch('/index.html')).text();
    const m = html.match(/const DATA = (\[[\s\S]*?\]);/);
    DATA = eval(m[1]);
  }catch(e){ console.warn('DATA introuvable :', e); }

  const byISO = {};
  DATA.forEach(d=>{ const iso=flagToISO(d.f); if(iso) byISO[iso]=d; });
  // Pays dont le code ISO manque dans la carte Natural Earth ("-99")
  const adminFix = { "France":"FR", "Norway":"NO" };

  function lookup(props){
    let iso = props.ISO_A2;
    if(!iso || iso==="-99") iso = props.ISO_A2_EH || adminFix[props.ADMIN] || adminFix[props.NAME] || "";
    return byISO[iso] || null;
  }

  // Carte des pays (GeoJSON)
  let countries;
  try{
    countries = await (await fetch('https://cdn.jsdelivr.net/gh/vasturiano/globe.gl@master/example/datasets/ne_110m_admin_0_countries.geojson')).json();
  }catch(e){
    document.getElementById('loading').innerHTML = '<div style="max-width:280px">😕 Impossible de charger la carte du monde.<br><br>Vérifie ta connexion Internet, puis recharge la page.</div>';
    return;
  }

  const infoEl = document.getElementById('info');
  function showCountry(d, fallbackName){
    if(d){
      document.getElementById('iFlag').innerHTML = flagImg(d.f, 60);
      document.getElementById('iCountry').textContent = d.c;
      document.getElementById('iCap').innerHTML = 'Capitale : <b>'+d.cap+'</b>';
      const cont = document.getElementById('iCont');
      cont.textContent = d.k; cont.style.background = COLORS[d.k]||'#9d7bff'; cont.style.display='inline-block';
    } else {
      document.getElementById('iFlag').textContent = '🏳️';
      document.getElementById('iCountry').textContent = fallbackName || 'Pays inconnu';
      document.getElementById('iCap').textContent = '(pas dans la liste des 195 pays)';
      document.getElementById('iCont').style.display='none';
    }
    infoEl.classList.add('show');
    document.getElementById('hint').classList.add('hide');
  }
  document.getElementById('iClose').onclick = ()=> infoEl.classList.remove('show');

  let hovered = null;
  const world = Globe()(document.getElementById('globeViz'))
    .backgroundColor('#0d0a1f')
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
    .polygonsData(countries.features)
    .polygonsTransitionDuration(120)
    .polygonAltitude(f => f===hovered ? 0.06 : 0.012)
    .polygonCapColor(f => {
      const d = lookup(f.properties);
      const base = d ? (COLORS[d.k]||'#9d7bff') : '#888';
      return f===hovered ? base : base+'70';
    })
    .polygonSideColor(()=> 'rgba(157,123,255,0.12)')
    .polygonStrokeColor(()=> 'rgba(255,255,255,0.35)')
    .polygonLabel(f => {
      const d = lookup(f.properties);
      return '<div style="font-family:sans-serif;font-weight:700;color:#fff;background:rgba(0,0,0,.65);padding:3px 9px;border-radius:7px">'+(d?d.c:(f.properties.ADMIN||'')) +'</div>';
    })
    .onPolygonHover(h => { hovered = h; world.polygonAltitude(world.polygonAltitude()); })
    .onPolygonClick(f => {
      showCountry(lookup(f.properties), f.properties.ADMIN || f.properties.NAME);
      if(f.properties.LABEL_X!=null && f.properties.LABEL_Y!=null){
        world.pointOfView({lat:+f.properties.LABEL_Y, lng:+f.properties.LABEL_X, altitude:1.8}, 800);
      }
    });

  // Rotation automatique douce
  world.controls().autoRotate = true;
  world.controls().autoRotateSpeed = 0.45;

  function resize(){ world.width(window.innerWidth); world.height(window.innerHeight); }
  window.addEventListener('resize', resize); resize();

  document.getElementById('loading').style.display='none';

  // Hooks de test
  window.__byISOcount = Object.keys(byISO).length;
  window.__nbPolygons = countries.features.length;
  window.__lookup = lookup;
})();
</script>
</body>
</html>
