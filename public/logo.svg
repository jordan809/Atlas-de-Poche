<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Les Capitales du Monde">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a5cff"/>
      <stop offset="55%" stop-color="#ff5d8f"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5d8f"/>
      <stop offset="100%" stop-color="#ef3e5b"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globeClip"><circle cx="236" cy="276" r="150"/></clipPath>
  </defs>

  <!-- Badge background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Globe -->
  <circle cx="236" cy="276" r="150" fill="url(#globe)"/>

  <!-- Continents + meridians (clipped to globe) -->
  <g clip-path="url(#globeClip)">
    <g fill="#2fc4a8">
      <path d="M150 200 q40 -28 78 -10 q26 12 14 40 q-10 24 -44 22 q-30 -2 -40 18 q-12 22 -36 8 q-20 -12 -8 -42 q14 -28 36 -36 Z"/>
      <path d="M250 300 q34 -16 60 6 q20 16 6 44 q-14 28 -50 30 q-40 2 -54 -26 q-12 -28 12 -44 q14 -10 26 -10 Z"/>
      <path d="M300 196 q26 -6 36 14 q8 18 -10 30 q-22 14 -38 -2 q-14 -16 -2 -32 q6 -8 14 -10 Z"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3">
      <ellipse cx="236" cy="276" rx="150" ry="58"/>
      <ellipse cx="236" cy="276" rx="150" ry="118"/>
      <line x1="236" y1="126" x2="236" y2="426"/>
      <ellipse cx="236" cy="276" rx="60" ry="150"/>
    </g>
    <circle cx="236" cy="276" r="150" fill="url(#shine)"/>
  </g>
  <circle cx="236" cy="276" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6"/>

  <!-- Capital location pin -->
  <g transform="translate(322 96)">
    <path d="M0 150 C-46 86 -64 60 -64 26 A64 64 0 1 1 64 26 C64 60 46 86 0 150 Z"
          fill="url(#pin)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="0" cy="22" r="34" fill="#ffffff"/>
    <path d="M0 2 l8.5 17.5 19 2.5 -14 13.5 3.5 19 -17 -9.5 -17 9.5 3.5 -19 -14 -13.5 19 -2.5 Z"
          fill="#ffb020"/>
  </g>
</svg>
