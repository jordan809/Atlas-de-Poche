<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify — Atlas de poche</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1db954 0%, #191414 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.12); backdrop-filter: blur(10px);
    border-radius: 20px; padding: 40px 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .icon { font-size: 3rem; margin-bottom: 14px; }
  p { font-size: 1.1rem; font-weight: 700; }
  small { display: block; margin-top: 8px; opacity: 0.75; font-size: 0.88rem; }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="ico">⏳</div>
  <p id="msg">Connexion en cours…</p>
  <small id="sub">Tu peux fermer cette fenêtre.</small>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var code   = params.get('code');
  var state  = params.get('state');
  var error  = params.get('error');

  // Adresse de retour : uniquement vers les domaines du site (évite une redirection vers un site tiers).
  // Si le site a été ouvert sur un autre domaine que celui-ci (ex. atlasdepoche.com), le code de connexion ne peut pas
  // passer par le stockage du navigateur (propre à chaque domaine) : il est transmis dans le fragment de l'adresse.
  function safeTarget(ret, withCode) {
    var u;
    try { u = new URL(ret || '/', location.origin); } catch (e) { u = new URL('/', location.origin); }
    var ok = /^(localhost|127\.0\.0\.1|(www\.)?atlasdepoche\.com|atlas-de-poche\.(web\.app|firebaseapp\.com))$/.test(u.hostname) &&
             (u.protocol === 'https:' || u.hostname === 'localhost' || u.hostname === '127.0.0.1');
    if (!ok) u = new URL('/', location.origin);
    if (withCode && u.origin !== location.origin) u.hash = 'spcode=' + encodeURIComponent(withCode);
    return u.toString();
  }

  if (error) {
    document.getElementById('ico').textContent = '❌';
    document.getElementById('msg').textContent = 'Connexion annulée.';
    setTimeout(function() {
      var ret = null;
      try { ret = JSON.parse(localStorage.getItem('sp_ret')); } catch (e) {}
      try { ret = ret || (state ? decodeURIComponent(state) : null); } catch (e) {}
      location.replace(safeTarget(ret, null));
    }, 1500);
  } else if (code) {
    document.getElementById('ico').textContent = '✅';
    document.getElementById('msg').textContent = 'Connecté !';
    document.getElementById('sub').textContent = 'Redirection en cours…';
    localStorage.setItem('sp_pending_code', code);
    // Adresse de retour : on préfère le paramètre « state » (Spotify le renvoie tel quel), sinon le stockage local
    var ret = null;
    try { ret = state ? decodeURIComponent(state) : null; } catch (e) {}
    if (!ret) { try { ret = JSON.parse(localStorage.getItem('sp_ret')); } catch (e) {} }
    localStorage.removeItem('sp_ret');
    var target = safeTarget(ret, code);
    // le code est parti avec l'adresse (autre domaine) : inutile de le garder ici
    if (new URL(target).origin !== location.origin) localStorage.removeItem('sp_pending_code');
    setTimeout(function() { location.replace(target); }, 400);
  } else {
    document.getElementById('ico').textContent = '❓';
    document.getElementById('msg').textContent = 'Paramètre manquant.';
    setTimeout(function() { location.replace('/'); }, 1500);
  }
</script>
</body>
</html>
