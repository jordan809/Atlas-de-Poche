<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify — Atlas de poche</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1db954 0%, #191414 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.12); backdrop-filter: blur(10px);
    border-radius: 20px; padding: 40px 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .icon { font-size: 3rem; margin-bottom: 14px; }
  p { font-size: 1.1rem; font-weight: 700; }
  small { display: block; margin-top: 8px; opacity: 0.75; font-size: 0.88rem; }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="ico">⏳</div>
  <p id="msg">Connexion en cours…</p>
  <small id="sub">Tu peux fermer cette fenêtre.</small>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var code   = params.get('code');
  var state  = params.get('state');
  var error  = params.get('error');

  if (error) {
    document.getElementById('ico').textContent = '❌';
    document.getElementById('msg').textContent = 'Connexion annulée.';
    setTimeout(function() {
      var ret = null;
      try { ret = JSON.parse(localStorage.getItem('sp_ret')); } catch {}
      location.replace(ret || '/');
    }, 1500);
  } else if (code) {
    document.getElementById('ico').textContent = '✅';
    document.getElementById('msg').textContent = 'Connecté !';
    document.getElementById('sub').textContent = 'Redirection en cours…';
    localStorage.setItem('sp_pending_code', code);
    // Return URL: prefer state param (Spotify passes it back unchanged), fall back to localStorage
    var ret = null;
    try { ret = state ? decodeURIComponent(state) : null; } catch {}
    if (!ret) { try { ret = JSON.parse(localStorage.getItem('sp_ret')); } catch {} }
    localStorage.removeItem('sp_ret');
    setTimeout(function() { location.replace(ret || '/'); }, 400);
  } else {
    document.getElementById('ico').textContent = '❓';
    document.getElementById('msg').textContent = 'Paramètre manquant.';
    setTimeout(function() { location.replace('/'); }, 1500);
  }
</script>
</body>
</html>
